name: jam3iya_app
description: Jam3iya Rotating Savings App

publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

    
  



  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  app_badge_plus: ^1.1.3

  provider: ^6.1.2
  intl: ^0.20.0

  easy_localization: ^3.0.7
  image_picker: ^1.2.2
  shared_preferences: ^2.2.3 # ⭐ SAFE FIX: إضافة الحزمة المستخدمة فعلياً

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"




flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/translations/

